version: '3.8'

services:
  db:
    image: postgres:15
    container_name: airport_postgres
    environment:
      POSTGRES_DB: airport_system
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - airport_pgdata:/var/lib/postgresql/data

volumes:
  airport_pgdata:
